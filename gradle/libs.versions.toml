[versions]
tomcat = "10.1.31"
jackson = "2.17.2"
hikaricp = "5.1.0"
mysql = "8.4.0"
h2 = "2.2.224"
slf4j = "2.0.13"
jakarta-mail = "2.0.1"
poi = "5.3.0"
jsoup = "1.18.1"
junit = "5.11.4"
shadow = "9.6.1"

[libraries]
# HTTP server (embedded, no external Tomcat needed)
tomcat-embed-core = { module = "org.apache.tomcat.embed:tomcat-embed-core", version.ref = "tomcat" }
# JSON
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
# Database: connection pool + MySQL driver (H2 for the tests)
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikaricp" }
mysql-connector = { module = "com.mysql:mysql-connector-j", version.ref = "mysql" }
h2 = { module = "com.h2database:h2", version.ref = "h2" }
slf4j-nop = { module = "org.slf4j:slf4j-nop", version.ref = "slf4j" }
# Mail: SMTP sending and IMAP reading
jakarta-mail = { module = "com.sun.mail:jakarta.mail", version.ref = "jakarta-mail" }
# Excel files
poi-ooxml = { module = "org.apache.poi:poi-ooxml", version.ref = "poi" }
# HTML entity decoding (partner replies)
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
# Tests: JUnit 5
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
# one runnable jar with all dependencies (replaces maven-shade-plugin)
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
